<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bg color</title>
</head>
<style>
    .c{
        width: 100%;
        height: 100%;
    }
    #btn{
        margin: auto;
        padding: 1em;
        border: 3px solid black;
        outline: none;
    }
</style>
<body>
    <div class="c">
        <input type="button" id="btn" value ="change background">
    </div>
    <script>
        document.getElementById("btn").addEventListener("click",colorchange);
        function colorchange(){
            console.log(Math.random()*10000000);
            var color='#'+ Math.floor(Math.random()*10000000).toString(16);
            document.body.style.background= color;
        }
    </script>
    
</body>
</html>
